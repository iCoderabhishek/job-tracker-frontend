name: Deploy CDDD...

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Execute deployment script on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd ~/Dropdesk-Frontend
            git pull origin main
            docker compose up -d --build --force-recreate


# NOTE: THIS APPLIES FOR VPS DEPLOYMENT - WILL GO FOR AWS ECS DEPLOYMENT, WHICH STEPS ARE DIFFERENT