name: Validation Checks

on: 
  push:
    branches: 
      - main

jobs: 
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the code
        uses: actions/checkout@v4 
        with:
          fetch-depth: 0
          
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - name: Set up pnpm 
        uses: pnpm/action-setup@v3
        with:
          version: 9
          
      - name: Install pnpm modules
        run: pnpm install
        
      - name: Run build
        run: pnpm build 